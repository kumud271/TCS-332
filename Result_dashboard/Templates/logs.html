<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSecure - Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b, #334155);
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="/">🛡️ NetSecure</a>
        <a href="/" class="btn btn-outline-light btn-sm">New Scan</a>
    </nav>

    <div class="d-flex justify-content-center align-items-start" style="min-height: 85vh; padding-top: 60px;">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 700px; border-radius: 12px;">
            <h3 class="text-center mb-4">Scan Logs</h3>

            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Target</th>
                        <th>Scan Time</th>
                        <th>Risk Level</th>
                    </tr>
                </thead>
                <tbody>
                    {% for scan in scans %}
                    <tr>
                        <td>{{ scan.target }}</td>
                        <td>{{ scan.scan_time }}</td>
                        <td>{{ scan.risk_level }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
