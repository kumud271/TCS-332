<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSecure - Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b, #334155);
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="/">🛡️ NetSecure</a>
        <a href="/logs" class="btn btn-outline-light btn-sm">View Logs</a>
    </nav>

    <div class="d-flex justify-content-center align-items-center" style="min-height: 85vh;">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 600px; border-radius: 12px;">
            <h3 class="text-center mb-1">Scan Results</h3>
            <p class="text-center text-muted mb-4">{{ target }}</p>

            <div class="text-center mb-3">
                {% if risk == "Low" %}
                <span class="badge bg-success fs-6 px-3 py-2">Low Risk</span>
                {% elif risk == "Medium" %}
                <span class="badge bg-warning text-dark fs-6 px-3 py-2">Medium Risk</span>
                {% else %}
                <span class="badge bg-danger fs-6 px-3 py-2">High Risk</span>
                {% endif %}
            </div>

            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Port</th>
                        <th>Service</th>
                    </tr>
                </thead>
                <tbody>
                    {% for port in ports %}
                    <tr>
                        <td>{{ port.number }}</td>
                        <td>{{ port.service }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="/" class="btn btn-secondary w-100 mt-2">Scan Another Target</a>
        </div>
    </div>
</body>

</html>
